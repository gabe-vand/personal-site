  <header class="pitch-head">

    <h2 class="pitch-title">Off the wall.<span class="pitch-sub">Where I am when I&rsquo;m not here.</span></h2>

  <div class="frames-grid">

    <figure class="polaroid frame">
      <img src="/img/boulder-move.jpg" width="1050" height="1400" loading="lazy" alt="Gabe in a winter hat, pressed against a boulder in bare woods with an open hand flat on the rock">
      <figcaption>Open hand on a sloper. Nothing to actually hold on to &mdash; it is all friction and body position, and it stays on until it doesn&rsquo;t.</figcaption>
