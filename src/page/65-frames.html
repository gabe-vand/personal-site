<!-- ============================================================
     03 / OFF THE WALL. Photographs, pinned up as polaroids. They straighten
     when you point at one. EDIT: captions are mine to get wrong; the images
     live in site/img/ and a frame is one <figure>, safe to delete. Five of
     them fills a row of three and a row of two on a wide screen.
     ============================================================ -->
<section class="pitch frames" id="frames">
  <header class="pitch-head">
    <p class="pitch-tag mono">03 / off the wall</p>
    <h2 class="pitch-title">Off the wall.<span class="pitch-sub">Where I am when I&rsquo;m not here.</span></h2>
  </header>

  <div class="frames-grid">

    <figure class="polaroid frame">
      <img src="/img/boulder-woods.jpg" width="1050" height="1400" loading="lazy" alt="Gabe reaching high on a steep boulder in summer woods, crash pads and a spotter below">
      <figcaption>Pads down, hands on. Most of a session is the same six moves over and over until one of them quietly stops being hard.</figcaption>
    </figure>

    <figure class="polaroid frame">
      <img src="/img/horseback.jpg" width="1050" height="1400" loading="lazy" alt="View from horseback along a juniper trail, reins in hand, another rider ahead in a straw hat">
      <figcaption>Reins in one hand, phone in the other. That is both how you get the photograph and how you come off the horse.</figcaption>
    </figure>

    <figure class="polaroid frame">
      <img src="/img/gecko.jpg" width="1050" height="1400" loading="lazy" alt="A crested gecko climbing a branch in its enclosure, crest raised, one eye on the camera">
      <figcaption>Crook, my crested gecko, doing the most athletic thing he has done all month.</figcaption>
    </figure>

    <figure class="polaroid frame">
      <img src="/img/ski.jpg" width="1050" height="1400" loading="lazy" alt="Gabe on a snowboard pointing at the camera in heavy snow while his dad takes the photo">
      <figcaption>Snowing sideways, flat light, my dad behind the camera. He skis, I ride, and we have never settled it.</figcaption>
    </figure>

    <figure class="polaroid frame">
      <img src="/img/golf.jpg" width="1050" height="1400" loading="lazy" alt="Gabe and his dad in a golf cart on a wooded course on a bright day">
      <figcaption>Nine holes with my dad. The cart has GPS, a yardage book and a scorecard, and I still put it in the trees.</figcaption>
    </figure>

  </div>
</section>
