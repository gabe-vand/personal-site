<!-- ============================================================
     02 / SEND IT. Reaching this section fires the chalk burst once
     (js/chalk.js). The form has no backend: js/contact.js builds a mailto:
     link and hands it to the visitor's mail app. EDIT: the address is set in
     js/contact.js AND in the fallback link below.
     ============================================================ -->
<section class="pitch contact" id="contact">
  <header class="pitch-head">
    <p class="pitch-tag mono">02 / send it</p>
    <h2 class="pitch-title">Send it.<span class="pitch-sub">You made it to the end. Say hi.</span></h2>
  </header>

  <form id="contact-form" class="contact-form">
    <label class="visually-hidden" for="contact-subject">Subject</label>
    <input id="contact-subject" name="subject" type="text" placeholder="Subject" maxlength="120">
    <label class="visually-hidden" for="contact-from">Your email (optional, so I can reply)</label>
    <input id="contact-from" name="from" type="email" placeholder="Your email (optional, so I can reply)" maxlength="254" autocomplete="email">
    <label class="visually-hidden" for="contact-body">Message</label>
    <textarea id="contact-body" name="body" rows="5" placeholder="Say something&hellip;" maxlength="2000" required></textarea>
    <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn btn-big send-btn"><span class="send-label">Send it &rarr;</span></button>
    <p id="contact-note" class="contact-note mono" role="status" hidden></p>
    <button type="button" id="test-plane" class="btn btn-dev">test plane (dev)</button>
  </form>

  <!-- Shown in place of the form once a message has gone through (js/contact.js). -->
  <div class="contact-sent" id="contact-sent" hidden>
    <svg class="sent-check" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="M14 25 L21 32 L34 17"/></svg>
    <h3 class="sent-title">Sent.</h3>
    <p class="sent-body">It just landed in my inbox. I read everything &mdash; I&rsquo;ll write back<span id="sent-reply"></span>.</p>
    <button type="button" class="btn" id="sent-again">Send another &rarr;</button>
  </div>

  <p class="contact-alt">Or the plain way: <a href="mailto:gabe@gabevandevere.com">gabe@gabevandevere.com</a> &middot; <a href="https://www.linkedin.com/in/gabe-vandevere-96aa1628b/" rel="me noopener" target="_blank">LinkedIn</a></p>
</section>
</main>
