<!doctype html>
<!-- BUILT from src/admin/index.html by build.py; edit that, not this. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · gabevandevere.com</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=b09aa934">
<link rel="stylesheet" href="/admin/admin.css?v=b09aa934">
<script type="module" src="/admin/js/main.js?v=b09aa934"></script>
</head>
<body class="admin">
<!-- Login: shown until /api/admin/me says the session cookie is valid. -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <p class="mono login-tag">gabevandevere.com / admin</p>
    <label for="login-email">Email</label>
    <input id="login-email" name="email" type="email" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    <label for="login-code" id="login-code-label" hidden>Authenticator code</label>
    <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" hidden>
    <button type="submit" class="btn" id="login-btn">Sign in</button>
    <p id="login-error" class="login-error mono" role="alert" hidden></p>
  </form>
</section>

<!-- App shell -->
<div id="app" class="app" hidden>
  <header class="app-head">
    <a class="app-brand mono" href="/">&larr; gabevandevere.com</a>
    <nav class="app-nav mono" id="nav">
      <a href="#overview">Overview</a>
      <a href="#humans">Humans</a>
      <a href="#ai">AI &amp; bots</a>
      <a href="#conversations">Conversations</a>
      <a href="#emails">Emails</a>
      <a href="#cloudflare">Cloudflare</a>
      <a href="#security">Security</a>
    </nav>
    <div class="app-tools mono">
      <label for="days">window</label>
      <select id="days">
        <option value="1">24 h</option>
        <option value="7" selected>7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="0">all time</option>
      </select>
      <button type="button" class="btn btn-small" id="logout">Sign out</button>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
</div>
</body>
</html>
